spring.application.name=StarShop
spring.config.import=classpath:database-team.properties,classpath:mail-team.properties,classpath:cloudinary-team.properties,classpath:vnpay-team.properties,classpath:gemini-team.properties,optional:file:./.local/application-local.properties,optional:file:./.local/services.properties,optional:file:./.local/gemini.properties

server.port=8080
server.forward-headers-strategy=framework


spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB


spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp
spring.security.filter.dispatcher-types=request,async,error
